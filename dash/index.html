<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Spark Digital Tag Activity</title>
<link rel="icon" type="image/png" href="/m/icon-192.png">
<style>
:root{--red:#C8102E;--navy:#1F2A5A;--ink:#1d1d1f;--mut:#666;--line:#e5e5e5;--bg:#f6f6f4;--up:#1a7f37;--down:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#111;color:#fff;padding:14px 16px;border-bottom:4px solid #F5B400}header h1{margin:0;font-size:19px}header p{margin:2px 0 0;color:#bbb;font-size:13px}
main{max-width:1150px;margin:0 auto;padding:16px}
.signin{max-width:360px;margin:12vh auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
input,select,button{font:inherit;font-size:16px}input{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin:6px 0 12px}
button{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar select{padding:8px;border-radius:10px;border:1px solid #ccc;background:#fff}
.seg{display:inline-flex;background:#fff;border:1px solid #ccc;border-radius:10px;overflow:hidden}.seg button{background:#fff;color:var(--ink);border-radius:0;padding:8px 16px;font-weight:600}.seg button.on{background:var(--ink);color:#fff}
.ghost{background:#fff;color:var(--ink);border:1px solid #ccc}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:12px;padding:12px 14px}.kpi b{display:block;font-size:28px;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}.kpi i{font-style:normal;font-size:13px;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin-top:12px}
.card{background:#fff;border-radius:12px;padding:12px 14px;min-width:0}.card h2{font-size:15px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}td.n,th.n{text-align:right;white-space:nowrap}
.barc{height:4px;background:var(--red);border-radius:2px;margin-top:3px;opacity:.75}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mut);margin:4px 0 0}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.chart svg{width:100%;height:auto;display:block}
.roll{overflow-x:auto}.roll table{min-width:860px}.roll th{text-align:center;line-height:1.2}.roll td{text-align:center;vertical-align:middle}.roll td.st{text-align:left;white-space:nowrap}
.ck{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-weight:800;font-size:14px;border:2px solid #d0d0d0;color:#999;background:#fff;padding:0}
.ck.y{background:var(--up);border-color:var(--up);color:#fff}.ck.p{background:#F5B400;border-color:#F5B400;color:#111;font-size:11px}.ck.m{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--up)}
button.ck{cursor:pointer}.pbar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:var(--up)}
.feed td:first-child{white-space:nowrap;color:var(--mut);font-size:13px}
.mut{color:var(--mut)}.err{color:var(--down)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;color:#fff}
</style></head>
<body>
<header><h1>Spark Digital Tag Activity</h1><p>Every customer and team interaction on the digital tags, by day, week and month</p></header>
<main id="app"></main>
<script>
const API = "https://script.google.com/macros/s/AKfycbxcj7HnpGxRFSILwbOjYf-9j11h1KSAHLnhmYvpJvZ6g2sukb_9ldyFG-rN2LoWCZfA/exec";
const LSM = ["Burleson","Colleyville","Denton","Farmers Branch","Keller","Lewisville","Renfro","San Antonio"];
const app = document.getElementById("app");
let A = [], per = "day", store = "All stores";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls = { get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
/* Interaction types. Customer = what shoppers do. Team = what the store team does. */
const TYPES = {
  scan:   {n:"Customer tag scans", g:"c"}, go: {n:"Lender QR scans", g:"c"}, lead: {n:"Hold or contact requests", g:"c"}, install: {n:"Home screen adds", g:"t"},
  staffscan: {n:"Team tag scans", g:"t"}, signin: {n:"Store page sign ins", g:"t"}, serial: {n:"Serial plate scans", g:"t"}, move: {n:"Units moved", g:"t"},
  map: {n:"Map and hanger changes", g:"t"}, post: {n:"Social posts", g:"t"}, poststart: {n:"Posts started", g:"t"}, price: {n:"Price change requests", g:"t"},
  photo: {n:"Unit photos", g:"t"}, room: {n:"Showroom photos", g:"t"}, diagram: {n:"Showroom drawing requests", g:"t"}, print: {n:"Tags printed", g:"t"} };
const KPI = ["scan", "lead", "go", "post", "move", "signin"];
function normalize(D){
  const out = [], P = (t, type, st, who, what) => { const d = new Date(t); if (!isNaN(d)) out.push({d, type, st: st || "", who: who || "", what: what || ""}); };
  (D.events || []).forEach(r => { const [t, ty, st, unit, tag, det, who] = r;
    if (ty === "scan") P(t, who ? "staffscan" : "scan", st, who, unit ? "Unit " + unit : "");
    else if (ty === "go") P(t, "go", st, "", det + (tag ? " from " + tag : ""));
    else if (ty === "step") { if (String(det).startsWith("open")) P(t, "poststart", st, who, unit ? "Unit " + unit : ""); }
    else if (ty === "signin") P(t, "signin", st, who, "");
    else if (ty === "serialscan") P(t, "serial", st, who, det === "none" ? "No match" : "Matched by " + det);
    else if (ty === "install") P(t, "install", st, who, "");
    else if (ty === "print") P(t, "print", st, who, "Unit " + unit); });
  (D.moves || []).forEach(r => P(r[0], r[2] ? "move" : "map", r[1], r[3], r[2] ? "Unit " + r[2] : "Map or hangers"));
  (D.posts || []).forEach(r => P(r[0], "post", r[1], r[4], "Unit " + r[2] + " to " + r[3]));
  (D.leads || []).forEach(r => P(r[0], "lead", r[1], "Customer", "Unit " + r[2] + (r[3] ? ", prefers " + r[3] : "")));
  (D.prices || []).forEach(r => P(r[0], "price", r[1], r[3], "Unit " + r[2] + ", " + r[4]));
  (D.photos || []).forEach(r => P(r[0], "photo", r[1], r[3], "Unit " + r[2]));
  (D.rooms || []).forEach(r => P(r[0], "room", r[1], r[2], ""));
  (D.diagrams || []).forEach(r => P(r[0], "diagram", r[1], r[2], r[3] + (r[4] ? " by " + r[4] : "")));
  return out.sort((a, b) => b.d - a.d);
}
/* Period windows: day starts at midnight, week starts Monday, month on the 1st. */
function start(p, d, back){ const x = new Date(d); x.setHours(0,0,0,0);
  if (p === "day") x.setDate(x.getDate() - back);
  if (p === "week") { x.setDate(x.getDate() - ((x.getDay() + 6) % 7) - 7 * back); }
  if (p === "month") { x.setDate(1); x.setMonth(x.getMonth() - back); }
  return x; }
function label(p, d){ return p === "day" ? d.toLocaleDateString("en-US", {month:"numeric", day:"numeric"}) : p === "week" ? "Wk " + d.toLocaleDateString("en-US", {month:"numeric", day:"numeric"}) : d.toLocaleDateString("en-US", {month:"short", year:"2-digit"}); }
const inStore = r => store === "All stores" ? true : store === "All LSM" ? LSM.includes(r.st) : r.st === store;
function signin(msg){
  app.innerHTML = `<form class="signin" id="f"><h2 style="margin-top:0">Sign in</h2><p class="mut">For leaders with all store access. Enter your personal code.</p>
  <input id="c" type="text" inputmode="numeric" maxlength="4" placeholder="Your code" value="${esc(ls.get("sparkcode"))}"><button>Open dashboard</button><p class="err">${esc(msg||"")}</p></form>`;
  document.getElementById("f").onsubmit = e => { e.preventDefault(); const c = document.getElementById("c").value.trim(); ls.set("sparkcode", c); load(c); };
}

/* LSM rollout progress: the first assignments in the Welcome to Spark Digital Tags email, per store.
   Green = done (read from the digital tag data). Gold = started. Tap an empty circle to check it off by hand. */
const RT = [["confirm","Reply: Drive and PDF","Reply to the welcome email confirming they can open the Price Tags Drive folder and Reading the LSM Tag. You check this one off."],
  ["bm","1. BM signed in","Branch manager signed in on the store page."],["isr","1. ISR signed in","Nominated ISR signed in on the store page."],
  ["install","1. Home screen","Someone at the store added the store page to a phone home screen."],["hangers","2. QR hangers","PB01 to PB10 placed on the showroom drawing."],
  ["firetags","3. Fire Sale tags","Every Fire Sale unit has its tag front and back. You check this one off."],["maploc","4. Map location","A location named on the store map."],
  ["unitloc","5. Unit location set","A unit's location set on its digital tag."],["post","6. Money Maker posted","A unit posted from the Post this unit section."],
  ["lead","7. Customer test","A Hold this unit or Contact me request sent from the store."]];
let RO = null;
function rollCard(){
  if (!RO) return "";
  const when = a => a ? new Date(a).toLocaleDateString("en-US", {month:"numeric", day:"numeric"}) : "";
  const rows = Object.entries(RO.stores).map(([st, o]) => {
    const done = RT.filter(([k]) => o.tasks[k] && o.tasks[k].done).length, pct = Math.round(done / RT.length * 100);
    return `<tr><td class="st"><b>${esc(st)}</b><div class="mut" style="font-size:12px">${done} of ${RT.length} done</div><div class="pbar"><i style="width:${pct}%"></i></div></td>${RT.map(([k, n]) => { const t = o.tasks[k] || {};
      const tip = n + (t.done ? ": done" + (t.by ? " by " + t.by : "") + (t.at ? " " + when(t.at) : "") + (t.manual ? " (checked by hand)" : "") : t.n ? ": " + t.n + (t.of ? " of " + t.of : "") + " so far" : ": not yet") + (k === "bm" || k === "isr" ? (t.done ? "" : " (" + (t.by || "name not on file") + ")") : "");
      const cls = "ck" + (t.done ? " y" : t.n ? " p" : "") + (t.manual ? " m" : ""), lbl = t.done ? "✓" : t.n ? (t.of ? t.n + "/" + t.of : t.n) : "";
      const tap = !t.done || t.manual;
      return `<td>${tap ? `<button class="${cls}" data-rs="${esc(st)}" data-rk="${k}" data-rd="${t.done ? 0 : 1}" title="${esc(tip)}. Tap to ${t.done ? "uncheck" : "check off by hand"}." aria-label="${esc(st + ", " + tip)}">${lbl}</button>` : `<span class="${cls}" title="${esc(tip)}" aria-label="${esc(st + ", " + tip)}">${lbl}</span>`}</td>`; }).join("")}</tr>`; }).join("");
  const tot = Object.values(RO.stores).reduce((a, o) => a + RT.filter(([k]) => o.tasks[k] && o.tasks[k].done).length, 0), all = Object.keys(RO.stores).length * RT.length;
  return `<div class="card roll" style="margin-bottom:14px"><h2>LSM rollout progress: first assignments (${tot} of ${all} done)</h2>
    <table><tr><th style="text-align:left">Store</th>${RT.map(([k, n, d]) => `<th title="${esc(d)}">${esc(n)}</th>`).join("")}</tr>${rows}</table>
    <p class="mut" style="font-size:13px;margin:8px 0 0">Green is done, read straight from the digital tags. Gold means started. Hover or long press a circle for who and when. Tap an empty circle to check it off by hand (Reply and Fire Sale tags always need you). Your own tests and anything named Test are not counted.</p></div>`;
}
async function rollLoad(c){ try { const r = await fetch(API + "?" + new URLSearchParams({action:"rollout", store:"Keller", pin:"", code:c})).then(x => x.json()); RO = r.ok ? r : null; } catch(e){ RO = null; } }
async function rollSet(st, k, d){
  const c = ls.get("sparkcode");
  try { const r = await fetch(API + "?" + new URLSearchParams({action:"rolloutset", store:st, task:k, done:d, pin:"", code:c})).then(x => x.json()); if (r.ok) { RO = r; draw(); } } catch(e){}
}
async function load(c){
  app.innerHTML = `<p class="mut">Loading activity...</p>`;
  try {
    const r = await fetch(API + "?" + new URLSearchParams({action:"dash", store:"Keller", pin:"", code:c})).then(x => x.json());
    if (!r.ok) return signin(r.error === "owner" ? "This dashboard is for all store access only." : "Code not accepted.");
    await rollLoad(c); A = normalize(r); draw();
  } catch(e){ signin("Could not reach the server. Try again."); }
}
function chg(a, b){ if (!b) return a ? `<i class="up">new</i>` : `<i class="flat">same</i>`; const p = Math.round((a - b) / b * 100); return `<i class="${p > 0 ? "up" : p < 0 ? "down" : "flat"}">${p > 0 ? "up " : p < 0 ? "down " : ""}${Math.abs(p)}%</i>`; }
function count(rows, f){ const m = {}; rows.forEach(r => { const k = f(r); if (k) m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
function table(title, rows, head, note){ const max = rows.length ? rows[0][1] : 1;
  return `<div class="card"><h2>${title}</h2>${rows.length ? `<table><tr><th>${head}</th><th class="n">Count</th></tr>${rows.slice(0, 15).map(([k, v]) => `<tr><td>${esc(k)}<div class="barc" style="width:${Math.max(4, v / max * 100)}%"></div></td><td class="n">${v}</td></tr>`).join("")}</table>` : `<p class="mut">${note || "Nothing in this period yet."}</p>`}</div>`; }
function chart(rows){
  const N = per === "day" ? 14 : 12, now = new Date(), B = [];
  for (let i = N - 1; i >= 0; i--) { const a = start(per, now, i), b = i ? start(per, now, i - 1) : new Date(8.64e15); B.push({a, b, c:0, t:0}); }
  rows.forEach(r => { const k = B.find(x => r.d >= x.a && r.d < x.b); if (k) k[TYPES[r.type].g === "c" ? "c" : "t"]++; });
  const W = 760, H = 220, pad = 30, max = Math.max(4, ...B.map(x => x.c + x.t)), bw = (W - pad) / N;
  const y = v => H - 24 - v / max * (H - 44);
  const bars = B.map((x, i) => { const X = pad + i * bw + bw * 0.15, w = bw * 0.7;
    return `<rect x="${X}" y="${y(x.c)}" width="${w}" height="${H - 24 - y(x.c)}" fill="var(--red)"><title>${label(per, x.a)}: ${x.c} customer</title></rect>
      <rect x="${X}" y="${y(x.c + x.t)}" width="${w}" height="${y(x.c) - y(x.c + x.t)}" fill="var(--navy)"><title>${label(per, x.a)}: ${x.t} team</title></rect>
      ${x.c + x.t ? `<text x="${X + w / 2}" y="${y(x.c + x.t) - 4}" font-size="11" text-anchor="middle" fill="#444">${x.c + x.t}</text>` : ""}
      <text x="${X + w / 2}" y="${H - 8}" font-size="11" text-anchor="middle" fill="#666">${label(per, x.a)}</text>`; }).join("");
  return `<div class="card chart"><h2>${per === "day" ? "Last 14 days" : per === "week" ? "Last 12 weeks" : "Last 12 months"}</h2>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Interactions per ${per}"><line x1="${pad}" x2="${W}" y1="${H - 24}" y2="${H - 24}" stroke="#ccc"/>${bars}</svg>
    <div class="legend"><span style="--c:var(--red)">Customer</span><span style="--c:var(--navy)">Team</span></div></div>`;
}
function draw(){
  const now = new Date(), a0 = start(per, now, 0), a1 = start(per, now, 1);
  const S = A.filter(inStore), cur = S.filter(r => r.d >= a0), prev = S.filter(r => r.d >= a1 && r.d < a0);
  const c = t => cur.filter(r => r.type === t).length, p = t => prev.filter(r => r.type === t).length;
  const word = per === "day" ? ["Today", "yesterday"] : per === "week" ? ["This week", "last week"] : ["This month", "last month"];
  const stores = ["All stores", "All LSM"].concat([...new Set(A.map(r => r.st).filter(Boolean))].sort());
  app.innerHTML = `<div class="bar"><div class="seg">${[["day","Daily"],["week","Weekly"],["month","Monthly"]].map(([v, n]) => `<button data-p="${v}" class="${v === per ? "on" : ""}">${n}</button>`).join("")}</div>
      <select id="st" aria-label="Store">${stores.map(s => `<option ${s === store ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
      <button class="ghost" id="rf">Refresh</button><span class="mut">${word[0]}: ${cur.length} interactions, ${chg(cur.length, prev.length)} vs ${word[1]}</span></div>
    ${store === "All stores" || store === "All LSM" || LSM.includes(store) ? rollCard() : ""}
    <div class="kpis">${KPI.map(t => `<div class="kpi"><b>${c(t)}</b><span>${TYPES[t].n}</span><br>${chg(c(t), p(t))} <span>vs ${word[1]} (${p(t)})</span></div>`).join("")}</div>
    ${chart(S)}
    <div class="grid">
      <div class="card"><h2>${word[0]} by type</h2><table><tr><th>Interaction</th><th class="n">${word[0]}</th><th class="n">${word[1][0].toUpperCase() + word[1].slice(1)}</th><th class="n">Change</th></tr>
        ${Object.keys(TYPES).filter(t => c(t) || p(t)).map(t => `<tr><td><span class="tag" style="background:${TYPES[t].g === "c" ? "var(--red)" : "var(--navy)"}">${TYPES[t].g === "c" ? "Customer" : "Team"}</span> ${TYPES[t].n}</td><td class="n">${c(t)}</td><td class="n">${p(t)}</td><td class="n">${chg(c(t), p(t))}</td></tr>`).join("") || `<tr><td colspan="4" class="mut">Nothing yet.</td></tr>`}</table></div>
      ${table("By store", count(cur, r => r.st), "Store")}
      ${table("Team members", count(cur.filter(r => TYPES[r.type].g === "t" && r.who), r => r.who), "Person")}
      ${table("Customer scans by store", count(cur.filter(r => r.type === "scan"), r => r.st), "Store")}
    </div>
    <div class="card feed" style="margin-top:12px"><h2>Latest activity (${word[0].toLowerCase()})</h2>${cur.length ? `<table>${cur.slice(0, 60).map(r => `<tr><td>${r.d.toLocaleString("en-US", {month:"numeric", day:"numeric", hour:"numeric", minute:"2-digit"})}</td><td><span class="tag" style="background:${TYPES[r.type].g === "c" ? "var(--red)" : "var(--navy)"}">${TYPES[r.type].n}</span> ${esc(r.st)}${r.who && r.who !== "Customer" ? ", " + esc(r.who) : ""}${r.what ? `<div class="mut">${esc(r.what)}</div>` : ""}</td></tr>`).join("")}</table>` : `<p class="mut">Nothing yet in this period.</p>`}</div>
    <p class="mut" style="margin-top:12px">Every interaction is also emailed to Brandon within a minute under the Spark Tag Alerts label. Customer names and phone numbers stay in the Leads tab of the Spark Tag Location PINs sheet.</p>`;
  app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { per = b.dataset.p; draw(); });
  document.getElementById("st").onchange = e => { store = e.target.value; draw(); };
  app.querySelectorAll("[data-rk]").forEach(b => b.onclick = () => { b.disabled = true; b.textContent = "..."; rollSet(b.dataset.rs, b.dataset.rk, b.dataset.rd); });
  document.getElementById("rf").onclick = () => load(ls.get("sparkcode"));
}
ls.get("sparkcode") ? load(ls.get("sparkcode")) : signin();
</script>
</body></html>
