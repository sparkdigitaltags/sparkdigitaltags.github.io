<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Spark Digital Tag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one phone width column, a black and gold header band, a price slab, then a counter strip of copyable DMS fields */
:root{
  --bg:#F2F1EC; --card:#FFFFFF; --ink:#121212; --muted:#5C5B55; --line:#DAD8CF;
  --gold:#F5B400; --gold-deep:#E08A00; --band:#121212; --band-ink:#FFFFFF; --fire:#C8102E; --ok:#1F7A3A; --chip:#F7F1DE;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif; --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E0E0D;--card:#1A1A18;--ink:#F3F1EA;--muted:#A8A69C;--line:#33322D;--band:#000000;--band-ink:#FFFFFF;--chip:#2A2616;--fire:#FF4D5E;--ok:#5BC77A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E0D;--card:#1A1A18;--ink:#F3F1EA;--muted:#A8A69C;--line:#33322D;--band:#000000;--band-ink:#FFFFFF;--chip:#2A2616;--fire:#FF4D5E;--ok:#5BC77A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:grid;gap:14px}
.brandbar{background:#FFFFFF;border-radius:14px;padding-block:10px;padding-inline:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:4px solid var(--gold)}
.brandbar img{height:46px;width:auto}
.brandbar .lbl{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:#121212;text-align:right;line-height:1.1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hero{display:grid;gap:10px;padding:16px}
.toprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--ink)}
.pill.fire{background:var(--fire);color:#FFFFFF}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.02;margin:0;text-wrap:balance;text-transform:uppercase}
.photo{background:#FFFFFF;border-radius:10px;display:grid;place-items:center;padding:8px}
.photo img{max-height:220px;width:auto;object-fit:contain}
.photo small{color:#5C5B55;font-size:11px}
.price{background:var(--band);color:var(--band-ink);padding:16px;display:grid;gap:6px;border-top:4px solid var(--gold)}
.price .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.was{font-size:15px;color:#BDBBB2}.was s{color:#BDBBB2}
.now{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.save{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.save b{color:var(--gold)}
.pay{font-size:14px;color:#E9E6DA}
.pay b{color:#FFFFFF}
.sect{padding:14px 16px;display:grid;gap:10px}
.sect h2{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;margin:0;color:var(--muted)}
.fields{display:grid;gap:8px}
.field{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.field .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field .v{font-family:var(--mono);font-size:15px;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
.copy{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:6px 12px;border-radius:8px;border:0;background:var(--gold);color:#121212}
.copy.done{background:var(--ok);color:#FFFFFF}
.copyall{width:100%;padding:12px;font-size:15px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold-deep);outline-offset:2px}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:460px){.lists{grid-template-columns:1fr}}
ul{margin:0;padding-left:18px;display:grid;gap:3px}
li::marker{color:var(--gold-deep)}
.fine{font-size:12px;color:var(--muted)}
.lookup{display:grid;gap:10px}
.lookup input{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.ulist{display:grid;gap:6px}
.ulist a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;background:var(--card)}
.ulist a span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.ulist a span:first-child{min-width:0}
.back{color:var(--ink);font-size:14px}
.apply{padding:14px 16px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.apply h2{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;margin:0;color:var(--muted)}
.lend{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;color:#FFFFFF;text-decoration:none;border:2px solid transparent}
.lend.sheffield{background:#A11829}.lend.terrace{background:#1F2A5A}.lend.koalafi{background:#111111;border-color:#3A3A36}
.lend .tier{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.lend .ttl{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;text-transform:uppercase}
.lend .sub{font-size:12px;color:#E2DED2}
.lend .go{font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#121212;padding:8px 12px;border-radius:8px;font-size:14px;white-space:nowrap}
.lend:hover .go,.lend:focus-visible .go{background:#FFFFFF}
</style>

</head>
<body style="margin:0">
<div class="wrap">
  <header class="brandbar"><img id="logo" alt="Spark Dealer Group"><div class="lbl">Digital<br>Price Tag</div></header>
  <main id="app"></main>
  <p class="fine">Prices, payments and promotions are subject to change and to credit or lease approval. Show this tag to any team member or at the counter.</p>
</div>

const SHARE_BASE = "https://sparkdigitaltags.github.io/";
document.getElementById("logo").src = DATA.logo;
DATA.units.forEach(u => { if (DATA.photos && DATA.photos[u.photo]) u.photo = DATA.photos[u.photo]; });
const byId = Object.fromEntries(DATA.units.map(u => [u.id, u]));
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function copyText(btn, text){
  const ok = () => { btn.textContent = "Copied"; btn.classList.add("done"); setTimeout(()=>{btn.textContent = btn.dataset.label; btn.classList.remove("done")}, 1500); };
  const fallback = () => { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try{document.execCommand("copy"); ok();}catch(e){} t.remove(); };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch(e){ fallback(); }
}

function tag(u){
  const payLine = u.lease
    ? `<b>Take it home today.</b> Lease to own, not a loan. No credit needed, approvals up to $7,500.`
    : `<b>$0 down, ${u.pay}/mo</b> for ${u.term} months at ${u.apr}% APR${u.promo_end ? ", promo expires " + u.promo_end : ""}. Sheffield Financial, on approved credit.`;
  const fields = [["Unit", u.unit], ["Model", u.model], ["Serial", u.serial], ["Price", u.now.replace("$","")]];
  const all = [`Store: LSM ${u.store}`, `Unit: ${u.unit}`, `Make: ${u.brand}`, `Model: ${u.model}`, `Serial: ${u.serial}`, `Desc: ${u.name}`, u.was ? `Was: ${u.was}` : "", `Now: ${u.now}${u.fire ? " FIRE SALE" : ""}`].filter(Boolean).join("\n");
  app.innerHTML = `
  <article class="card">
    <div class="hero">
      <div class="toprow">${u.fire ? '<span class="pill fire">Fire Sale</span>' : ''}<span class="pill">LSM Outdoor Power ${esc(u.store)}</span></div>
      <div class="brand">${esc(u.brand)}</div>
      <h1>${esc(u.name)}</h1>
      ${u.photo ? `<div class="photo"><img src="${u.photo}" alt="${esc(u.brand)} ${esc(u.model)}"><small>Manufacturer photo. Unit on display may vary.</small></div>` : ""}
    </div>
    <div class="price">
      <div class="row">${u.was ? `<span class="was">Was <s>${u.was}</s></span>` : `<span class="was">Price</span>`}${u.save ? `<span class="save">You save <b>${u.save}</b></span>` : ""}</div>
      <div class="now">${u.now}</div>
      <div class="pay">${payLine}</div>
    </div>
    <section class="apply">
      <h2>Apply for financing</h2>
      ${(DATA.lenders[u.store]||[]).map(l=>`<a class="lend ${l.k}" href="${l.url}" target="_blank" rel="noopener"><span><span class="tier">${esc(l.tier)}</span><br><span class="ttl">${esc(l.title)}</span><br><span class="sub">${esc(l.sub)}</span></span><span class="go">Apply</span></a>`).join("")}
      <p class="fine">Each option opens that lender's secure application for LSM Outdoor Power ${esc(u.store)}. Financing and leasing are subject to approval.</p>
    </section>
    <section class="sect">
      <h2>For our team</h2>
      <div class="fields">${fields.map(([k,v],i)=>`<div class="field"><span class="k">${k}</span><span class="v">${esc(v)}</span><button class="copy" id="c${i}" data-label="Copy" data-v="${esc(v)}">Copy</button></div>`).join("")}</div>
      <button class="copy copyall" id="call" data-label="Copy all unit info">Copy all unit info</button>
      ${SHARE_BASE.startsWith("http") ? `<button class="copy copyall" id="clink" data-label="Copy link to this tag">Copy link to this tag</button>` : ""}
    </section>
    <section class="sect">
      <div class="lists">
        <div><h2>Key features</h2><ul>${u.feats.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>
        <div><h2>Specifications</h2><ul>${u.specs.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>
      </div>
      <p class="fine">Warranty: ${esc(u.warranty)}. ${u.fire ? "Fire Sale pricing applies to this unit only while supplies last. " : ""}Prices exclude tax, title and registration.</p>
    </section>
  </article>`;
  app.querySelectorAll(".field .copy").forEach(b => b.addEventListener("click", () => copyText(b, b.dataset.v)));
  document.getElementById("call").addEventListener("click", e => copyText(e.currentTarget, all));
  const cl = document.getElementById("clink"); if (cl) cl.addEventListener("click", e => copyText(e.currentTarget, SHARE_BASE + "#" + u.id));
  window.scrollTo(0,0);
}

function lookup(){
  app.innerHTML = `<article class="card"><div class="sect"><h2>Scan a tag to see a unit</h2><p>Use your phone camera to scan the Spark code on the back of any LSM price tag. That unit's digital tag opens here.</p></div></article>`;
}

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (byId[h]) tag(byId[h]); else lookup();
}
window.addEventListener("hashchange", route);
route();
</script>
