<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Spark Lender Launch</title>
<meta name="apple-mobile-web-app-title" content="Lender Launch">
<meta name="application-name" content="Lender Launch">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="/sll/manifest.webmanifest">
<link rel="apple-touch-icon" href="/m/sll-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/m/sll-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/m/sll-32.png">
<script>
var APP="https://claude.ai/artifact/XekvMYRKGwW58Nk8qEoG3d", KEY="sll_installed_sll";
var standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
var fromIcon=/[?&]app=1/.test(location.search);
var done=false;try{done=localStorage.getItem(KEY)==="1"}catch(e){}
if(standalone||fromIcon||(done&&!/[?&]setup/.test(location.search)))location.replace(APP);
</script>
<style>
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#16181d;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{text-align:center;padding:28px;max-width:380px}
img{width:112px;height:112px;border-radius:26px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
h1{font-size:24px;margin:18px 0 6px}
p{color:#c7cad1;margin:0 0 22px}
button{width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:#e8590c;color:#fff;cursor:pointer}
.help{margin-top:16px;font-size:14px;color:#c7cad1;display:none;text-align:left;background:#22252c;border-radius:12px;padding:14px}
a{color:#ffb98a}
</style>
</head>
<body>
<div class="box">
<img src="/m/sll-180.png" alt="Spark">
<h1>Spark Lender Launch</h1>
<p id="msg">Tap below to add the Spark app to this device.</p>
<button id="go">Install app</button>
<div class="help" id="help"></div>
<p style="margin-top:18px;font-size:14px"><a href="#" id="open">Already installed? Open the app</a></p>
</div>
<script>
var ua=navigator.userAgent, ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var win=/Windows/.test(ua), mac=/Macintosh/.test(ua)&&!ios, deferred=null;
function mark(){try{localStorage.setItem(KEY,"1")}catch(e){}}
function help(h){var el=document.getElementById("help");el.innerHTML=h;el.style.display="block"}
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sll/sw.js",{scope:"/sll/"}).catch(function(){});
addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e});
addEventListener("appinstalled",function(){mark();document.getElementById("msg").textContent="Installed. Look for the Spark icon.";});
document.getElementById("open").onclick=function(e){e.preventDefault();mark();location.replace(APP)};
document.getElementById("go").onclick=function(){
  if(ios){mark();location.href="/sll/Spark-Lender-Launch.mobileconfig";help("Next: open <b>Settings</b>, tap <b>Profile Downloaded</b>, then <b>Install</b>. The Spark icon appears on your Home Screen.");return}
  if(deferred){deferred.prompt();deferred.userChoice.then(function(c){if(c.outcome==="accepted")mark()});deferred=null;return}
  if(win){mark();var a=document.createElement("a");a.href="/sll/Spark-Lender-Launch.url";a.download="Spark Lender Launch.url";document.body.appendChild(a);a.click();a.remove();help("Drag <b>Spark Lender Launch</b> from your Downloads onto your desktop. It has the Spark icon.");return}
  help(mac?"In Chrome, open the menu, then <b>Cast, save and share</b>, then <b>Install page as app</b>. In Safari, choose <b>File</b>, then <b>Add to Dock</b>.":"In Chrome, open the menu and tap <b>Add to Home screen</b>.");
};
</script>
</body>
</html>
